# Sentinela — orquestração dev/prod
# No dev, normalmente só o go2rtc roda via Docker; backend e frontend rodam direto
# (runners do claude-workspaces). Em prod, descomente backend/frontend/ai.

services:
  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: sentinela-go2rtc
    restart: unless-stopped
    network_mode: host          # facilita descoberta ONVIF/RTSP na LAN
    environment:
      # preenchidas pelo .env (ver .env.example)
      - CAM_ICSEE_IP=${CAM_ICSEE_IP}
      - CAM_ICSEE_PASS=${CAM_ICSEE_PASS}
      - CAM_YOOSEE_IP=${CAM_YOOSEE_IP}
      - CAM_YOOSEE_PASS=${CAM_YOOSEE_PASS}
    volumes:
      - ./go2rtc:/config

