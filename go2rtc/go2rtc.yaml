# go2rtc — engine de streaming do Sentinela
# Docs: https://github.com/AlexxIT/go2rtc
#
# Câmeras reais descobertas na LAN (ver docs/CAMERA-ACCESS.md). Senhas via env
# (${...}) — preencher no .env (ver .env.example). NÃO commitar senhas aqui.
#
# ⚠️ Os IPs vêm do DHCP e podem mudar quando a câmera reinicia. Reserve IP fixo
# para cada MAC no roteador (192.168.0.1):
#   portão  192.168.0.12  14:5d:34:ec:04:f9 (Yoosee/Bilian)
#   cam2    192.168.0.15  14:5d:34:f1:6a:ab (Yoosee/Bilian)
#   cam3    192.168.0.18  84:fc:14:80:c8:4d (Yoosee/Bilian)
#   icsee   192.168.0.66  48:a4:fd:c3:ab:8c (Xiongmai/iCSee)

api:
  listen: ":1984"           # API/UI — NÃO expor à internet; o backend faz proxy autenticado

rtsp:
  listen: ":8554"           # RTSP re-publicado (consumido pelo serviço de IA)

webrtc:
  listen: ":8555"           # WebRTC (TCP) — usado pelo <video-stream> no frontend

streams:
  # --- Yoosee (Gwell / Bilian) — RTSP, usuário "admin", senha ${CAM_YOOSEE_PASS}.
  # Validado: codec H.265/HEVC + áudio. /onvif1 = main (1920x2160), /onvif2 = sub (640x720).
  # H.265 não toca em WebRTC na maioria dos browsers → o go2rtc transcoda p/ H.264
  # sob demanda. Se algum stream falhar com erro de transporte ("Nonmatching
  # transport"), troque a linha por: ffmpeg:rtsp://...onvif1#input=rtsp/udp
  portao:                   # 192.168.0.12 — câmera do PORTÃO (alvo do alerta de IA)
    - rtsp://admin:${CAM_YOOSEE_PASS}@192.168.0.12:554/onvif1
  yoosee_2:                 # 192.168.0.15 (renomear conforme o cômodo/local)
    - rtsp://admin:${CAM_YOOSEE_PASS}@192.168.0.15:554/onvif1
  yoosee_3:                 # 192.168.0.18
    - rtsp://admin:${CAM_YOOSEE_PASS}@192.168.0.18:554/onvif1

  # --- iCSee (Xiongmai / Sofia / DVRIP) — caminho robusto via dvrip:// (porta 34567).
  # Usuário/senha próprios (${CAM_ICSEE_USER}/${CAM_ICSEE_PASS}). subtype 0=main, 1=sub.
  # Se o codec for H.265 e o browser reclamar:
  #   ffmpeg:dvrip://${CAM_ICSEE_USER}:${CAM_ICSEE_PASS}@192.168.0.66:34567?channel=0&subtype=0#video=h264
  icsee:                    # 192.168.0.66
    - dvrip://${CAM_ICSEE_USER}:${CAM_ICSEE_PASS}@192.168.0.66:34567?channel=0&subtype=0

# Dica: defina o I-frame interval da câmera = framerate para start mais rápido do WebRTC.
# Para a IA (frames mais leves), considere uma stream extra usando /onvif2 (sub).
